server {
    listen 80;
    server_name localhost;

    root /src;

    # Serve static files
    location / {
        try_files pages/index.html =404;
    }

    location /pages/ {
        try_files pages$uri pages$uri.html =404;
    }

    location /assets/ {
        try_files static/assets$uri =404;
    }

    # POST form submission to Flask
    location = /src/pages/contact {
        proxy_pass http://flask:5001/src/pages/contact;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # JSON API requests
    location /api/ {
        proxy_pass http://flask:5001/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
