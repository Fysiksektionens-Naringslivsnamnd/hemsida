version: '3'

services:
  flask:
    build: .
    working_dir: /app
    ports:
      - "5001:5001"
    volumes:
      - .:/app
      - .env:/app/.env
    env_file:
      - .env
    restart: always

  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./src:/usr/share/nginx/html
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - flask
    restart: always
