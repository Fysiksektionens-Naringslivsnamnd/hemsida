<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Admin Login</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  </head>
  <body class="bg-light d-flex align-items-center" style="min-height:100vh;">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-12 col-sm-8 col-md-6 col-lg-4">
          <div class="card shadow-sm">
            <div class="card-body">
              <h5 class="card-title mb-3 text-center">Admin Login</h5>
              {% if error %}
                <div class="alert alert-danger py-2">{{ error }}</div>
              {% endif %}
              <form method="POST" action="{{ url_for('admin_login_post') }}">
                <input type="hidden" name="next" value="{{ next }}">
                <div class="mb-3">
                  <label class="form-label">Password</label>
                  <input class="form-control" type="password" name="password" required autofocus>
                </div>
                <button class="btn btn-primary w-100" type="submit">Sign in</button>
              </form>
            </div>
          </div>
          <p class="text-muted small mt-3 text-center">Access restricted</p>
        </div>
      </div>
    </div>
  </body>
</html>
